name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CalculadoraHex.slnx

      - name: Build
        run: dotnet build CalculadoraHex.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/CalculadoraHex.Core.Tests -c Release --no-build

      - name: Publish (single file, win-x64)
        run: >
          dotnet publish src/CalculadoraHex.App/CalculadoraHex.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish

      - uses: actions/upload-artifact@v5
        with:
          name: CalculadoraHex-win-x64
          path: publish/CalculadoraHex.exe
